{% extends "base.html" %}
{% block title %}Вход — {{ branding.product_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card bg-black border-secondary shadow-lg">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-eye-fill text-info" style="font-size: 3rem;"></i>
                    <h3 class="mt-2">{{ branding.product_name }}</h3>
                    <p class="text-secondary small">Аналитика видеонаблюдения</p>
                </div>
                <form method="post" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-person"></i> Логин</label>
                        <input type="text" class="form-control" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-key"></i> Пароль</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember">
                        <label class="form-check-label" for="remember">Запомнить меня</label>
                    </div>
                    <button class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </button>
                </form>
            </div>
        </div>
        <p class="text-center text-secondary mt-3 small">
            По умолчанию: <code>admin</code> / <code>admin</code>
        </p>
    </div>
</div>
{% endblock %}
